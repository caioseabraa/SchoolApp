<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School App 1.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>School App v1.0</h1>
    </header>
    <section>
        <div id="qtde">
            <h2>Escolha uma das opções a seguir:</h2>
            <h3>Notas:</h3>
            <p>
                <input type="radio" name="radnote" id="anual" checked>
                <label for="anual">Anual</label>
                <input type="radio" name="radnote" id="sem">
                <label for="sem">Semestral</label>
                <input type="radio" name="radnote" id="tri">
                <label for="tri">Trimestral</label>
                <input type="radio" name="radnote" id="bi">
                <label for="bi">Bimestral</label>
                <input type="radio" name="radnote" id="men">
                <label for="men">Mensal</label>
            </p>
            <h3>Alunos:</h3>
            <p>
                Digite a quantidade de Alunos:
                <input type="number" name="txtqtde" id="qtdenum">
            </p>
            <input type="button" value="Adicionar Informações" id="config" onclick="configForm()">
            <br>
            <br>
        </div>
        <div id ="stu">
            
        </div>
        <div id="res">
            
        </div>
    </section>
    <footer>
        <p>
            visit on github:
            <a href="https://github.com/caioseabraa" target="_blank" rel="noopener noreferrer">caioseabraa</a>
        </p>
            
    </footer>



    <script src="script.js"></script>
</body>
</html>
